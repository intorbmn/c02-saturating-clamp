# EEE703128 - RTL-to-GDSII tren GitHub Actions (Cong A)
# De C02 - Bo kep gia tri bao hoa 8-bit. Dua tren mau CI cua giang vien,
# chi sua: ba bien env, lenh mo phong (dung lai sim/run_sim.sh), duong dan artifacts.
name: RTL to GDSII

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MA_DE: C02
  DESIGN_NAME: sat_clamp
  CONFIG: openlane/config.json

jobs:
  mo-phong:
    name: 1 - Mo phong RTL (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Ghi lai phien ban cong cu
        run: |
          iverilog -V | head -1 | tee tool_versions.txt
          echo "Ngay chay: $(date -Is)" | tee -a tool_versions.txt
          echo "Commit: $GITHUB_SHA" | tee -a tool_versions.txt

      - name: Mo phong thuong (5 ca cua de)
        run: bash sim/run_sim.sh --thuong | tee simulation_thuong.log

      - name: Mo phong tu kiem (vet can)
        run: bash sim/run_sim.sh | tee simulation_selfcheck.log

      - name: Kiem log - phai co ALL TESTS PASSED, khong co loi
        run: |
          # Khong tin ma thoat: phai doc noi dung log.
          if grep -qE "LOI:|TESTS FAILED|FATAL" simulation_selfcheck.log; then
            echo "::error::Testbench bao loi - xem simulation_selfcheck.log"
            exit 1
          fi
          grep -q "ALL TESTS PASSED" simulation_selfcheck.log || {
            echo "::error::Khong thay dong ALL TESTS PASSED"; exit 1; }
          grep "so phep kiem" simulation_selfcheck.log
          echo "Mo phong dat."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mo-phong-${{ env.MA_DE }}
          path: |
            simulation_thuong.log
            simulation_selfcheck.log
            tool_versions.txt
            sim/waveforms/*.vcd
          if-no-files-found: warn

  rtl2gds:
    name: 2 - RTL-to-GDSII (LibreLane + sky130A)
    runs-on: ubuntu-latest
    needs: mo-phong
    steps:
      - uses: actions/checkout@v4

      - name: Cai Nix kem bo nho dem nhi phan cua FOSSi
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Lay LibreLane
        run: git clone --depth 1 https://github.com/librelane/librelane ~/librelane

      - name: Chay flow
        run: |
          cd ~/librelane
          nix-shell --run "cd '$GITHUB_WORKSPACE' && librelane --version | tee flow_versions.txt && librelane '$CONFIG'"

      - name: Kiem SAN PHAM, khong chi kiem ma thoat
        run: |
          GDS=$(find . -name "*.gds" | head -1)
          MJ=$(find . -name "metrics.json" | head -1)
          if [ -z "$GDS" ]; then echo "::error::Khong sinh duoc file GDS"; exit 1; fi
          if [ -z "$MJ" ];  then echo "::error::Khong co metrics.json";   exit 1; fi
          echo "GDS: $GDS"
          echo "metrics: $MJ"
          echo "--- Chi so chinh, chep vao bao cao ---"
          python3 .github/doc_metrics.py "$MJ" | tee metrics_chinh.txt

      - uses: actions/upload-artifact@v4
        # Tai len CA KHI FLOW HONG - nhat ky loi cung la bang chung hop le.
        if: always()
        with:
          name: rtl2gds-${{ env.MA_DE }}
          path: |
            **/runs/**/final/**
            **/runs/**/*.log
            **/metrics.json
            **/*.gds
            **/runs/**/*.rpt
            **/runs/**/resolved.json
            flow_versions.txt
            metrics_chinh.txt
          if-no-files-found: warn
